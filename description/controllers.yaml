# ros2_control controllers for Nova5 + Robotiq 2F-85 in Gazebo Classic.
# Arm part is the same as Dobot's nova5_moveit/config/ros2_controllers.yaml,
# so the arm action stays /nova5_group_controller/follow_joint_trajectory.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    nova5_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    gripper_controller:
      type: position_controllers/GripperActionController

nova5_group_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

# Action: /gripper_controller/gripper_cmd  (control_msgs/action/GripperCommand)
# command.position = finger_joint angle in rad: 0.0 = fully open, 0.725 = fully closed
gripper_controller:
  ros__parameters:
    joint: finger_joint
    goal_tolerance: 0.01
    allow_stalling: true   # report success if the fingers are blocked (e.g. by the box wall)
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0
